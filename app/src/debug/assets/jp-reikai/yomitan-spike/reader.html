<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>縦書きテスト</title>
    <style>
        html, body { margin: 0; height: 100%; background: #fbf8f1; color: #222; }
        body { writing-mode: vertical-rl; font-family: "Noto Serif CJK JP", serif; font-size: 26px; line-height: 1.9; padding: 32px 24px; box-sizing: border-box; overflow-x: auto; }
        p { margin: 0 0 0 1em; text-indent: 1em; }
        rt { font-size: 0.5em; }
    </style>
    <script src="/__reikai/reader.js"></script>
    <script src="/js/app/content-script-wrapper.js"></script>
</head>
<body>
<p>その日の夕方、彼女は駅前の古い<ruby>喫茶店<rt>きっさてん</rt></ruby>で友達を待っていた。窓の外では雨が降り続いていて、通りを歩く人々は皆傘をさしていた。</p>
<p>注文したコーヒーはすっかり冷めてしまったが、彼女はまだ一口も飲んでいなかった。約束の時間はとっくに過ぎていたのに、友達からは何の連絡も来ない。</p>
<p>仕方なく鞄から読みかけの小説を取り出して、続きを読み始めた。物語の主人公は、忘れられた村で不思議な出来事に巻き込まれていく少年だった。</p>
<p>庭の馬酔木が白い花を咲かせていた。</p>
</body>
</html>
