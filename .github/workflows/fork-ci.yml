name: Fork CI

# The fork's own build check. It runs on pull requests and on pushes to main that change code,
# needs no secrets, and publishes nothing. Upstream Reikai's workflows are not part of the fork.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Harness, format, compile, tests
    # The upstream sync runs these same checks before it pushes its merge, so it is not built twice.
    if: "!startsWith(github.event.head_commit.message, 'chore(sync): merge upstream')"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Harness checks
        run: |
          # The edit hook tells upstream-owned files apart by looking them up in upstream's tree.
          git remote add upstream https://github.com/unseensnick/Reikai.git
          git fetch --quiet --depth 1 upstream main
          python3 .claude/hooks/test_hooks.py
          python3 scripts/fork/seams.py --check

      - name: Yomitan stand-in and bump script tests
        # Seconds: Node and Python come with the runner. The module's Kotlin tests run in `test` below.
        run: |
          node --test jp-yomitan/src/test/js/*.test.mjs
          python3 -m unittest scripts/fork/test_yomitan_bump.py

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          # main saves the Gradle cache so later builds start warm; pull requests only read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Format
        run: ./gradlew spotlessCheck --console=plain

      - name: Dependency-injection ownership
        run: pwsh -NoProfile -File scripts/di-interop-check.ps1

      - name: Database migrations
        run: ./gradlew verifySqlDelightMigration --console=plain

      - name: Compile and unit tests
        run: ./gradlew :app:compileDebugKotlin test --console=plain
